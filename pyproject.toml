[project]
name = "autonomous-sales-agent"
version = "0.1.0"
description = "Production-oriented autonomous sales agent"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]