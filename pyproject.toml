
[project]
name = "autonomous-sales-agent"
version = "0.1.0"
description = "Production-oriented autonomous sales agent"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "python-dotenv",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "groq>=0.18,<2.0",
    "httpx>=0.28,<1.0",
    "beautifulsoup4>=4.13,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
